name: Deploy to GitHub Pages

# Replaces GitHub's default "pages build and deployment" (Jekyll) with a plain
# static deploy on current action versions. No Jekyll build, no Node 20 warning,
# and a higher deploy retry budget so the flaky "Deployment failed, try again
# later" backend error self-heals instead of needing a manual re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you re-run a deploy from the Actions tab, no commit needed

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time. Don't cancel an in-flight deploy — just queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true     # switch Pages source from "branch" to "GitHub Actions" if needed

      # Assemble a clean site dir — only the app, not .git / the Kalshi worker.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000     # 10 min ceiling for the whole publish
          error_count: 20     # tolerate more transient backend errors before giving up
